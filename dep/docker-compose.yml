version: "3.9"

# =============================================================================
# Code Runner — Coolify Deployment  →  run.kshitijsahdev.lol
#
# HOW TO DEPLOY ON COOLIFY:
#   1. Create a new "Docker Compose" service in Coolify
#   2. Point it at your repo
#   3. Set the required environment variables in the Coolify UI:
#        VITE_CLERK_PUBLISHABLE_KEY  — from Clerk dashboard
#   4. Deploy — that's it. Runner images are auto-built on first startup.
#
# REQUIRED ENV VARS (set in Coolify → Environment):
#   SERVICE_FQDN_APP                  — auto-set by Coolify
#   VITE_CLERK_PUBLISHABLE_KEY        — Clerk publishable key for auth
#
# OPTIONAL ENV VARS:
#   MAX_CONCURRENT     — max simultaneous executions per IP (default: 3)
#   TIMEOUT_BATCH      — batch execution timeout in seconds (default: 10)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Main application: Go API server + React SPA
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: dep/Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
    image: code-runner-app:latest

    restart: unless-stopped

    environment:
      PORT: "8080"
      MAX_CONCURRENT: "${MAX_CONCURRENT:-3}"
      TIMEOUT_BATCH: "${TIMEOUT_BATCH:-10}"

    volumes:
      # Mount the Docker socket — needed for spawning runners AND building runner images
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared temp directory — the app writes code files here, and runner
      # containers mount the same host path. Without this, the app's /tmp
      # is inside its own container filesystem, invisible to the host Docker.
      - /tmp/code-runner:/tmp/code-runner

    networks:
      - coolify
      - internal

    # Healthcheck — Coolify uses this to gate traffic
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      coolify.managed: "true"
      # Explicit Traefik labels
      traefik.enable: "true"
      # Service definition — container port
      traefik.http.services.code-runner-svc.loadbalancer.server.port: "8080"
      # HTTP router — serves traffic from Cloudflare (which terminates TLS)
      traefik.http.routers.code-runner-http.rule: "Host(`run.kshitijsahdev.lol`)"
      traefik.http.routers.code-runner-http.entryPoints: "http"
      traefik.http.routers.code-runner-http.service: "code-runner-svc"
      # HTTPS router — for direct access and Cloudflare Full SSL mode
      traefik.http.routers.code-runner-https.rule: "Host(`run.kshitijsahdev.lol`)"
      traefik.http.routers.code-runner-https.entryPoints: "https"
      traefik.http.routers.code-runner-https.service: "code-runner-svc"
      traefik.http.routers.code-runner-https.tls: "true"
      traefik.http.routers.code-runner-https.tls.certresolver: "letsencrypt"

  # Runner images are NOT separate compose services.
  # They're auto-built by the app container's entrypoint script on startup
  # using the mounted Docker socket. Images persist on the host between deploys.

networks:
  coolify:
    external: true
  internal:
    driver: bridge