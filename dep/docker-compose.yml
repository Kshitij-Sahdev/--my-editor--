version: "3.9"

# =============================================================================
# Code Runner — Coolify Deployment  →  run.kshitijsahdev.lol
#
# HOW TO DEPLOY ON COOLIFY:
#   1. Create a new "Docker Compose" service in Coolify
#   2. Point it at your repo
#   3. Set the required environment variables in the Coolify UI:
#        VITE_CLERK_PUBLISHABLE_KEY  — from Clerk dashboard
#   4. Deploy — Coolify + Traefik handle SSL automatically
#   5. After first deploy, run `docker compose --profile build-runners build`
#      on the host to build runner images (one-time setup)
#
# REQUIRED ENV VARS (set in Coolify → Environment):
#   SERVICE_FQDN_APP                  — auto-set by Coolify
#   VITE_CLERK_PUBLISHABLE_KEY        — Clerk publishable key for auth
#
# OPTIONAL ENV VARS:
#   MAX_CONCURRENT     — max simultaneous executions per IP (default: 3)
#   TIMEOUT_BATCH      — batch execution timeout in seconds (default: 10)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Main application: Go API server + React SPA
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: dep/Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
    image: code-runner-app:latest

    restart: unless-stopped

    environment:
      # Coolify: route https://run.kshitijsahdev.lol → container port 8080
      SERVICE_FQDN_APP_8080: "https://run.kshitijsahdev.lol"
      PORT: "8080"
      MAX_CONCURRENT: "${MAX_CONCURRENT:-3}"
      TIMEOUT_BATCH: "${TIMEOUT_BATCH:-10}"

    volumes:
      # Mount the Docker socket so the Go server can spawn runner containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - coolify
      - internal

    # Healthcheck — Coolify uses this to gate traffic
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      coolify.managed: "true"

  # ---------------------------------------------------------------------------
  # Language runner images (built once, used by the app at runtime)
  # These are build-only — they don't run as long-lived services.
  # The Go server spawns them via `docker run` when executing user code.
  #
  # Build with:  docker compose --profile build-runners build
  # ---------------------------------------------------------------------------
  runner-python:
    build: dep/runner-python
    image: runner-python:latest
    profiles: ["build-runners"]
    command: ["true"]

  runner-js:
    build: dep/runner-javascript
    image: runner-js:latest
    profiles: ["build-runners"]
    command: ["true"]

  runner-go:
    build: dep/runner-go
    image: runner-go:latest
    profiles: ["build-runners"]
    command: ["true"]

  runner-cpp:
    build: dep/runner-cpp
    image: runner-cpp:latest
    profiles: ["build-runners"]
    command: ["true"]

  runner-java:
    build: dep/runner-java
    image: runner-java:latest
    profiles: ["build-runners"]
    command: ["true"]

networks:
  coolify:
    external: true
  internal:
    driver: bridge